[project]
name = "ai-kan"
version = "0.1.0"
description = "This project aim to deal with a variety of files to be extracted to custom output data"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
ai-kan = "ai_kan:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
